<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}">

<head>
  <title>Editar Sesión</title>
</head>

<body>
  <div layout:fragment="content">
    <!-- Page Header -->
    <div
      th:replace="~{fragments/page-header :: page-header('Editar Sesión', true, '/expedientes/editar/' + ${expediente.idExpediente})}">
    </div>

    <!-- Formulario Principal -->
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
          <i class="fa fa-calendar-alt me-2"></i>
          Editar Sesión del Expediente <span th:text="${expediente.codigoSeguimiento}"></span>
        </h5>
      </div>
      <div class="card-body">
        <form th:action="@{/expedientes/sesiones/{id}/editar(id=${sesion.idExpedienteSesion})}" method="post"
          th:object="${sesion}" enctype="multipart/form-data">

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Cód. Seguimiento Expediente</label>
              <input type="text" class="form-control" th:value="${expediente.codigoSeguimiento}" disabled>
            </div>
            <div class="col-md-4">
              <label class="form-label">Estado del Expediente</label>
              <input type="text" class="form-control" th:value="${expediente.estadoExpediente}" disabled>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Número de Sesión</label>
              <input type="text" class="form-control" th:value="${sesion.secuencia}" disabled>
            </div>
            <div class="col-md-4">
              <label class="form-label">Estado de la Sesión</label>
              <select class="form-select" name="estadoSesion" required>
                <option value="Progra" th:selected="${sesion.estadoSesion == 'Progra'}">Programada</option>
                <option value="En Cur" th:selected="${sesion.estadoSesion == 'En Cur'}">En Curso</option>
                <option value="Cerrad" th:selected="${sesion.estadoSesion == 'Cerrad'}">Cerrada</option>
                <option value="Anulad" th:selected="${sesion.estadoSesion == 'Anulad'}">Anulada</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Fecha de Sesión</label>
              <input type="datetime-local" class="form-control" name="fechaSesion"
                th:value="${#temporals.format(sesion.fechaSesion, 'yyyy-MM-dd''T''HH:mm')}">
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label class="form-label">Detalles de Sesión</label>
              <textarea class="form-control" name="detallesSesion" rows="4"
                th:text="${sesion.detallesSesion}"></textarea>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Resolución</label>
              <input type="number" class="form-control" name="resolucionSesion" th:value="${sesion.resolucionSesion}">
            </div>
          </div>
          <hr class="border-light mt-4">
          <!-- Sección: Documentos adjuntos -->
          <div id="listaDocumentosAdjuntos" class="mb-3">
            <h6 class="text-muted"><i class="fa fa-paperclip me-1"></i> Documentos adjuntos</h6>
            <p class="text-muted small" id="sinDocumentos">No hay documentos adjuntos aún.</p>
          </div>
          <div class="d-flex justify-content-start flex-wrap gap-2 mt-3">
            <button type="button" class="btn btn-secondary" id="btnAdjuntarDoc" data-bs-toggle="modal"
              data-bs-target="#modalAdjuntarDoc">
              <i class="fa fa-upload me-1"></i> Adjuntar Documento
            </button>
            <button type="submit" class="btn btn-success">
              <i class="fa fa-save me-1"></i> Guardar
            </button>
            <a th:href="@{/expedientes/editar/{id}(id=${expediente.idExpediente})}" class="btn btn-danger">
              <i class="fa fa-times me-1"></i> Cerrar
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Adjuntar Documento (DENTRO del layout:fragment) -->
    <div class="modal fade" id="modalAdjuntarDoc" tabindex="-1" aria-labelledby="modalAdjuntarDocLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalAdjuntarDocLabel">
              <i class="fa fa-upload me-2"></i> Adjuntar Documento
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <form th:action="@{/sesiones/{id}/archivos(id=${sesion.idExpedienteSesion})}" method="post"
            enctype="multipart/form-data" id="formAdjuntarDoc">
            <div class="modal-body">
              <div class="mb-3">
                <label for="tituloDocumento" class="form-label">Nombre / Título del documento</label>
                <input type="text" class="form-control" id="tituloDocumento" name="docs[0].titulo"
                  placeholder="Ej: Acta de reunión, Contrato, etc." required>
              </div>
              <div class="mb-3">
                <label for="archivoDocumento" class="form-label">Archivo</label>
                <input type="file" class="form-control" id="archivoDocumento" name="docs[0].file" required>
                <div class="form-text">Formatos permitidos: PDF, Word, imágenes. Tamaño máximo: 10 MB.</div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">
                <i class="fa fa-upload me-1"></i> Subir Documento
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div><!-- End layout:fragment="content" -->
</body>

</html>
